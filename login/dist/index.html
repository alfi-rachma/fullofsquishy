<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>slider sign in / sign up form</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <br>
<br>
    <div class="cont">
        <form class="form sign-in" id="loginForm">
            <h2>Welcome</h2>
            <label>
                <span>User ID</span>
                <input type="text" id="username" />
            </label>
            <label>
                <span>Password</span>
                <input type="password" id="password" />
            </label>
            <p class="forgot-pass">Forgot password?</p>
            <button type="button" class="submit" id="signinBtn">Sign In</button>
          </form>
        </div>
        <div class="sub-cont">
            <div class="img">
                <div class="img__text m--up">
                 
                    <h3>Don't have an account? Please Sign up!</h3>
                </div>
                <div class="img__text m--in">
                
                    <h3>If you already has an account, just sign in.</h3>
                </div>
                <div class="img__btn">
                    <span class="m--up">Sign Up</span>
                    <span class="m--in">Sign In</span>
                </div>
            </div>
            <div class="form sign-up">
                <h2>Create your Account</h2>
                <label>
                    <span>Name</span>
                    <input type="text" id="name" />
                </label>
                <label>
                    <span>User ID</span>
                    <input type="text" id="regUsername" />
                </label>
                <label>
                    <span>Password</span>
                    <input type="password" id="regPassword" />
                </label>
                <button type="button" class="submit" id="signupBtn">Sign Up</button>
            </div>
        </div>
    </div>

    <script>
        document.querySelector('.img__btn').addEventListener('click', function() {
            document.querySelector('.cont').classList.toggle('s--signup');
        });
    </script>

    <script>
document.getElementById("signinBtn").addEventListener("click", function () {

    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    let dataUser = localStorage.getItem(username);

    if(dataUser){

        let user = JSON.parse(dataUser);

        if(user.password === password){

            localStorage.setItem("isLoggedIn", "true");
            localStorage.setItem("username", username);

            alert("Login berhasil");

            window.location.href = "../../index.html";

        }else{

            alert("Password salah");

        }

    }else{

        alert("User tidak ditemukan");

    }

});
</script>

<script>
document.getElementById("signupBtn").addEventListener("click", function(){

    let nama = document.getElementById("name").value;
    let username = document.getElementById("regUsername").value;
    let password = document.getElementById("regPassword").value;

    if(localStorage.getItem(username)){

        alert("Username sudah digunakan");
        return;

    }

    let user = {
        nama:nama,
        username:username,
        password:password
    };

    localStorage.setItem(username, JSON.stringify(user));

    alert("Registrasi berhasil");

    document.getElementById("name").value = "";
    document.getElementById("regUsername").value = "";
    document.getElementById("regPassword").value = "";

});
</script>
    
</body>
</html>
